services:
  openrailrouting:
    # Overridable from docker/.env to run a second instance next to this one; see docker/README.md.
    image: "${ORR_IMAGE:-docker-openrailrouting}"
    container_name: "${ORR_CONTAINER_NAME:-train_routing_gh}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${ORR_PORT:-8989}:8989"
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./osm:/app/data
      - ./graph-cache:/app/graph-cache
      - ./custom_models:/app/custom_models:ro 
    environment:
      - JAVA_OPTS=-Xmx32g

# Shared with the services_proxy nginx, which reaches the router by container name
# (train-gh.srv.trainlog.me -> train_routing_gh:8989). The Makefile creates it if missing.
networks:
  default:
    name: trainlog_network
    external: true
